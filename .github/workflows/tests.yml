name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt

      - name: Lire la version de Playwright installée
        id: playwright
        run: echo "version=$(python -c 'import playwright; print(playwright.__version__)')" >> "$GITHUB_OUTPUT"

      - name: Restaurer le cache Chromium (Playwright)
        id: cache-chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}

      - name: Télécharger Chromium (si absent du cache)
        if: steps.cache-chromium.outputs.cache-hit != 'true'
        run: playwright install chromium

      - name: Installer les dépendances système de Chromium
        run: playwright install-deps chromium

      - name: Lancer les tests avec couverture
        run: |
          set -o pipefail
          python -m pytest --cov 2>&1 | tee rapport_tests.txt

      - name: Publier la couverture dans le résumé du job
        if: always()
        run: |
          {
            echo "## Couverture des tests"
            echo
            python -m coverage report --format=markdown || echo "_Couverture indisponible : les tests se sont interrompus avant la mesure._"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Uploader la sortie complète de pytest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-tests-${{ github.run_id }}
          path: rapport_tests.txt
          retention-days: 30
          if-no-files-found: ignore
