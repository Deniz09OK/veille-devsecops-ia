name: Veille DevSecOps

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

concurrency:
  group: veille-devsecops
  cancel-in-progress: false

jobs:
  veille:
    strategy:
      fail-fast: false
      matrix:
        include:
          - groupe_id: secu
            mots_cles: "SecOps,Cloud Security Engineer,Ingénieur SecOps,Architecte Sécurité Cloud,Consultant Sécurité Cloud"
          - groupe_id: cloud-devops
            mots_cles: "DevSecOps,DevOps,Cloud Builder,Ingénieur Cloud,Ingénieur DevOps"
          - groupe_id: infra-sre
            mots_cles: "Site Reliability Engineer (SRE),Ingénieur Système et Réseau,Ingénieur de Production IT et Release Engineer"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Installer les dépendances Python
        run: pip install -r requirements.txt

      - name: Lire la version de Playwright installée
        id: playwright
        run: echo "version=$(python -c 'import playwright; print(playwright.__version__)')" >> "$GITHUB_OUTPUT"

      - name: Restaurer le cache Chromium (Playwright)
        id: cache-chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}

      - name: Télécharger Chromium (si absent du cache)
        if: steps.cache-chromium.outputs.cache-hit != 'true'
        run: playwright install chromium

      - name: Installer les dépendances système de Chromium
        run: playwright install-deps chromium

      - name: Restaurer le modèle d'embedding ChromaDB
        uses: actions/cache@v4
        with:
          path: ~/.cache/chroma
          key: chroma-onnx-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Restaurer l'état de la veille (mémoire IA, historique, Excel)
        uses: actions/cache/restore@v4
        with:
          path: |
            memoire_ia_${{ matrix.groupe_id }}
            historique_offres_${{ matrix.groupe_id }}.json
            suivi_candidatures_${{ matrix.groupe_id }}.xlsx
            Historique
          key: v2-etat-veille-${{ matrix.groupe_id }}-${{ github.run_id }}
          restore-keys: |
            v2-etat-veille-${{ matrix.groupe_id }}-

      - name: Lancer le script de veille
        run: python veille_devsecops.py
        env:
          FT_CLIENT_ID: ${{ secrets.FT_CLIENT_ID }}
          FT_CLIENT_SECRET: ${{ secrets.FT_CLIENT_SECRET }}
          LBA_API_KEY: ${{ secrets.LBA_API_KEY }}
          WEBHOOK_DISCORD: ${{ secrets.WEBHOOK_DISCORD }}
          GROUPE_ID: ${{ matrix.groupe_id }}
          MOTS_CLES_GROUPE: ${{ matrix.mots_cles }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}

      - name: Sauvegarder l'état de la veille pour le prochain run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            memoire_ia_${{ matrix.groupe_id }}
            historique_offres_${{ matrix.groupe_id }}.json
            suivi_candidatures_${{ matrix.groupe_id }}.xlsx
            Historique
          key: v2-etat-veille-${{ matrix.groupe_id }}-${{ github.run_id }}

      - name: Uploader les résultats du groupe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veille-devsecops-${{ matrix.groupe_id }}-${{ github.run_id }}
          path: |
            suivi_candidatures_${{ matrix.groupe_id }}.xlsx
            Historique
            debug_screenshots
          retention-days: 30
          if-no-files-found: warn

  fusionner:
    needs: veille
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Télécharger les résultats des 3 groupes
        uses: actions/download-artifact@v4
        with:
          pattern: veille-devsecops-*-${{ github.run_id }}
          path: resultats-bruts
          merge-multiple: false

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Installer les dépendances de fusion
        run: pip install pandas openpyxl

      - name: Fusionner les Excel des 3 groupes
        id: stats
        run: python -m veille.fusion resultats-bruts suivi_candidatures_MASTER.xlsx

      - name: Uploader l'Excel Master
        uses: actions/upload-artifact@v4
        with:
          name: veille-devsecops-MASTER-${{ github.run_id }}
          path: |
            suivi_candidatures_MASTER.xlsx
            resultats-bruts
          retention-days: 30
          if-no-files-found: warn

      - name: Envoyer l'e-mail de fin de pipeline
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_APP_PASSWORD }}
          from: Veille DevSecOps <${{ secrets.EMAIL_USERNAME }}>
          to: ${{ secrets.EMAIL_USERNAME }}
          subject: ${{ needs.veille.result == 'success' && '✅ Veille DevSecOps - Run terminé' || '⚠️ Veille DevSecOps - Run terminé avec erreurs' }}
          body: |
            Résultat des 3 groupes (secu / cloud-devops / infra-sre) : ${{ needs.veille.result }}
            Offres au total dans le Master : ${{ steps.stats.outputs.total }}
            Meilleure offre du jour : ${{ steps.stats.outputs.resume }}
            Détails : https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          attachments: suivi_candidatures_MASTER.xlsx
